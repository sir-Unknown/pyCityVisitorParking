documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
          - "CHANGELOG.md"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

maintenance:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "uv.lock"
          - ".pre-commit-config.yaml"
          - ".github/CODEOWNERS"
          - ".github/PULL_REQUEST_TEMPLATE.md"
          - ".github/ISSUE_TEMPLATE/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "uv.lock"
          - ".github/dependabot.yml"

schema:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/schema*"
          - "src/**/*schema*"
          - "src/**/*.json"
