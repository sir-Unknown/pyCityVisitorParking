documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
          - "CHANGELOG.md"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

bugfix:
  - head-branch:
      - "^bugfix(?:/|-.+|$)"
      - "^fix(?:/|-.+|$)"
      - "^hotfix(?:/|-.+|$)"

new-feature:
  - head-branch:
      - "^feat(?:/|-.+|$)"
      - "^feature(?:/|-.+|$)"

refactor:
  - head-branch:
      - "^refactor(?:/|-.+|$)"

performance:
  - head-branch:
      - "^perf(?:/|-.+|$)"
      - "^performance(?:/|-.+|$)"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

maintenance:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "uv.lock"
          - ".pre-commit-config.yaml"
          - ".github/CODEOWNERS"
          - ".github/PULL_REQUEST_TEMPLATE.md"
          - ".github/ISSUE_TEMPLATE/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "uv.lock"
          - ".github/dependabot.yml"

schema:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/schema*"
          - "src/**/*schema*"
          - "src/**/*.json"
