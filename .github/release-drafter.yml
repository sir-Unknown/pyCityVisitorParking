name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

sort-direction: ascending

include-paths:
  - "src/"
  - "pyproject.toml"
  - "README.md"
  - "CHANGELOG.md"
  - "LICENSE"
  - "docs/RELEASING.md"

categories:
  - title: "Breaking changes"
    labels:
      - "breaking-change"
      - "major"
  - title: "New features"
    labels:
      - "new-feature"
      - "feature"
  - title: "Bug fixes"
    labels:
      - "bugfix"
      - "bug"
      - "fix"
  - title: "Enhancements"
    labels:
      - "enhancement"
      - "refactor"
      - "performance"
      - "schema"
      - "tests"
  - title: "Maintenance"
    labels:
      - "maintenance"
      - "ci"
      - "github-actions"
  - title: "Documentation"
    labels:
      - "documentation"
  - title: "Dependency updates"
    labels:
      - "dependencies"

version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
  minor:
    labels:
      - "enhancement"
      - "new-feature"
      - "feature"
      - "schema"
  patch:
    labels:
      - "bugfix"
      - "bug"
      - "fix"
      - "ci"
      - "dependencies"
      - "documentation"
      - "github-actions"
      - "maintenance"
      - "performance"
      - "refactor"
      - "tests"
  default: patch

template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
