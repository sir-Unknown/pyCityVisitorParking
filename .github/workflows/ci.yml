name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Lint (ruff)
        run: |
          uv run --group lint ruff check .
          uv run --group lint ruff format --check .

      - name: Type check (pyright)
        run: uv run --group typecheck pyright

      - name: Tests
        run: uv run --group test pytest

      - name: Build (sdist + wheel)
        run: uv build

      - name: Verify dist metadata
        run: uvx twine check dist/*

  schema:
    name: Validate provider manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Validate provider manifests
        run: uv run --group schema python -m pytest -o addopts=-q tests/test_manifest_schema.py
