# Main CI pipeline: linting (ruff), type checking (pyright), tests (pytest),
# and a dist build + metadata check (twine). Runs on every PR, push to main,
# and on version tags (v*) so the release artifact is validated before publish.
#
# Note: uv caching is intentionally disabled (enable-cache: false) because this
# workflow triggers on tags used for publishing. An attacker could poison a
# cached package and have it included in the published artifact.
#
# Two jobs run in parallel:
#   test   — lint, type-check, tests, build
#   schema — validates every provider manifest.json against its JSON schema
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Verify lockfile is up to date
        run: |
          uv lock --check

      - name: Lint (ruff)
        run: |
          uv run --group lint ruff check .
          uv run --group lint ruff format --check .

      - name: Type check (pyright)
        run: uv run --group typecheck pyright

      - name: Tests
        run: uv run --group test pytest

      - name: Build (sdist + wheel)
        run: uv build

      - name: Verify dist metadata
        run: uvx twine check dist/*

  schema:
    name: Validate provider manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Validate provider manifests
        run: uv run --group schema python -m pytest -o addopts=-q tests/test_manifest_schema.py
