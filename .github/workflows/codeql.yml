# Static analysis via GitHub CodeQL for Python source and GitHub Actions workflows.
# Runs the security-extended + security-and-quality query suites and uploads
# findings as SARIF to GitHub code scanning.
#
# Custom query config is in .github/codeql/codeql-config.yml.
# Only triggers on changes to src/, tests/, workflow files, or codeql config
# to avoid unnecessary runs on docs or other non-code changes. All workflow
# files are included because this workflow also analyzes language: actions.
name: "CodeQL Advanced"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".github/codeql/**"
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '45 12 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # Required for CodeQL and SARIF uploads.
      packages: read # Required for private-action and package metadata reads during analysis.
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml
        queries: security-extended,security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
      with:
        category: "/language:${{matrix.language}}"
