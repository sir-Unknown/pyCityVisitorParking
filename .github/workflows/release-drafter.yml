# Maintains a draft GitHub Release that is kept up-to-date with every push to
# main that touches package-shipping files. The draft is populated using the
# rules in .github/release-drafter.yml (categories, version bump strategy,
# etc.). When a release is ready, the draft is manually published which
# triggers the release.yml workflow to build and publish to PyPI.
#
# Only stable releases are drafted here. Beta pre-releases are tagged by hand
# on the head of a pull request and created with `gh release create
# --prerelease`; see "Release a beta first" in docs/RELEASING.md.
name: Release Drafter
# yamllint disable-line rule:truthy

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "docs/RELEASING.md"
      - ".github/release-drafter.yml"
      - ".github/workflows/release-drafter.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.5.25). Leave empty to auto-resolve from the latest stable release."
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create and update the draft release.
      pull-requests: read # Required to read merged pull requests for the release notes.

    steps:
      - name: Run Release Drafter
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
