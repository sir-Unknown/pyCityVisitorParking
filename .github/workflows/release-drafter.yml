# Maintains a draft GitHub Release that is kept up-to-date with every push to
# main that touches package-shipping files. The draft is populated using the
# rules in .github/release-drafter.yml (categories, version bump strategy,
# etc.). When a release is ready, the draft is manually published which
# triggers the release.yml workflow to build and publish to PyPI.
name: Release Drafter
# yamllint disable-line rule:truthy

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "docs/RELEASING.md"
      - ".github/release-drafter.yml"
      - ".github/release-drafter-beta.yml"
      - ".github/workflows/release-drafter.yml"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Release type."
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      version:
        description: "Version override (e.g. 0.5.25). Leave empty to auto-resolve from the latest stable release."
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Release Drafter (stable)
        if: inputs.prerelease == 'stable' || inputs.prerelease == ''
        uses: release-drafter/release-drafter@5de93583980a40bd78603b6dfdcda5b4df377b32 # v7.2.0
        with:
          version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get next beta version
        if: inputs.prerelease == 'beta'
        id: next_beta_version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            BASE="${INPUT_VERSION}"
          else
            BASE=$(gh release list --limit 1000 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease == false) | .tagName] | first' \
              | sed 's/^v//')
          fi
          LAST=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -E "^v${BASE}b[0-9]+$" \
            | grep -oE "b[0-9]+" \
            | grep -oE "[0-9]+$" \
            | sort -n | tail -1 || true)
          NEXT=$((${LAST:-0} + 1))
          echo "version=${BASE}b${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Run Release Drafter (beta pre-release)
        if: inputs.prerelease == 'beta'
        uses: release-drafter/release-drafter@5de93583980a40bd78603b6dfdcda5b4df377b32 # v7.2.0
        with:
          config-name: release-drafter-beta.yml
          prerelease: true
          version: ${{ steps.next_beta_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
