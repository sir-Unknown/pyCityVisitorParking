name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v0.5.14)"
        required: false
        default: "v0.0.0"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # Required for trusted publishing to PyPI via GitHub OIDC.

    steps:
      - name: Resolve tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "Tag is required to publish."
            exit 1
          fi
          if [ "$tag" = "v0.0.0" ]; then
            echo "Default tag v0.0.0 is not allowed. Provide an explicit tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.vars.outputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: false

      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          echo "__version__ = \"$version\"" > src/pycityvisitorparking/_version.py
          echo "Set package version to $version"

      - name: Build
        run: |
          uv build
          uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
