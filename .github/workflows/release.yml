name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # Required for trusted publishing to PyPI via GitHub OIDC.

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Missing release tag name."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z, got: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: false

      - name: Confirm checked out tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          CHECKED_OUT_TAG="$(git describe --tags --exact-match)"
          if [[ "$CHECKED_OUT_TAG" != "$RELEASE_TAG" ]]; then
            echo "Expected checkout at tag $RELEASE_TAG, got $CHECKED_OUT_TAG"
            exit 1
          fi

      - name: Log resolved package version
        run: |
          uv run python -c "from importlib.metadata import version; print(version('pycityvisitorparking'))"

      - name: Build
        run: |
          uv build
          uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
