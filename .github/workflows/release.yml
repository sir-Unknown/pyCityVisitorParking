name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v0.5.14)"
        required: false
        default: "v0.0.0"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # Required for trusted publishing to PyPI via GitHub OIDC.

    steps:
      - name: Resolve tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "Tag is required to publish."
            exit 1
          fi
          if [ "$tag" = "v0.0.0" ]; then
            echo "Default tag v0.0.0 is not allowed. Provide an explicit tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.vars.outputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Validate tag matches package version
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys
          tag = os.environ["RELEASE_TAG"]
          version_file = Path("src/pycityvisitorparking/_version.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', version_file)
          if not match:
            print("Could not read __version__ from _version.py")
            sys.exit(1)
          version = match.group(1)
          if tag != f"v{version}":
            print(f"Tag {tag} does not match package version {version}.")
            sys.exit(1)
          print(f"Tag {tag} matches package version {version}.")
          PY

      - name: Build
        run: |
          uv build
          uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
