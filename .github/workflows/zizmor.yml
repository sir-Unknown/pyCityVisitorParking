# Security audit of all GitHub Actions workflows using zizmor. Findings are
# uploaded as SARIF to GitHub code scanning so they appear in the Security tab.
#
# The zizmor step allows exit codes 0 (clean) and 1 (findings) — findings are
# visible via the SARIF upload in the Security tab. Exit codes >= 2 (crashes)
# still fail the job. The upload step runs with `if: always()` to ensure SARIF
# is uploaded even when zizmor reports findings.
name: Zizmor

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/codeql/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/codeql/**"
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Check GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload SARIF findings into GitHub code scanning.
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Run zizmor
        run: uv run --group security zizmor --format sarif . > zizmor.sarif || [ $? -eq 1 ]

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: zizmor.sarif
          category: zizmor
