# Security audit of all GitHub Actions workflows using zizmor. Findings are
# uploaded as SARIF to GitHub code scanning so they appear in the Security tab.
#
# The zizmor step uses `|| true` so that findings (exit code 1) do not fail
# the job — the SARIF upload handles visibility. Actual crashes still surface
# because only exit code 1 is suppressed.
# The upload step runs with `if: always()` to ensure SARIF is uploaded even
# when zizmor reports findings.
name: Zizmor

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/codeql/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/codeql/**"
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Check GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload SARIF findings into GitHub code scanning.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Run zizmor
        run: uv run --group security zizmor --format sarif . > zizmor.sarif || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor
