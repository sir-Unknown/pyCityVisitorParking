[build-system]
requires = ["hatchling>=1.28", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "pycityvisitorparking"
dynamic = ["version"]
description = "Async integration layer between Home Assistant and Dutch municipal visitor parking APIs."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "pyCityVisitorParking contributors" }]
keywords = ["home-assistant", "async", "aiohttp", "parking", "municipality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Framework :: AsyncIO",
  "Topic :: Home Automation",
]
dependencies = [
  "aiohttp>=3.9",
]

[dependency-groups]
lint = ["ruff==0.15.16", "pylint==4.0.5"]
security = ["zizmor==1.25.2"]
test = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "jsonschema==4.26.0",
]
schema = ["jsonschema==4.26.0", "pytest==9.0.3", "pytest-asyncio==1.4.0"]
typecheck = ["pyright==1.1.410", "pytest==9.0.3"]
dev = [
  "pre-commit==4.6.0",
  { include-group = "lint" },
  { include-group = "security" },
  { include-group = "test" },
  { include-group = "typecheck" },
]

[project.urls]
Homepage = "https://github.com/sir-Unknown/pyCityVisitorParking"
Repository = "https://github.com/sir-Unknown/pyCityVisitorParking"
Issues = "https://github.com/sir-Unknown/pyCityVisitorParking/issues"

# ----------------------------
# Hatch build configuration
# ----------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/pycityvisitorparking"]

[tool.hatch.build.targets.sdist]
include = [
  # Root docs
  "README.md",
  "CHANGELOG.md",
  "AGENTS.md",
  "docs/RELEASING.md",
  # Source
  "src/**",
  # CI / dev tooling (useful in sdist)
  ".github/workflows/*.yml",
  ".devcontainer/devcontainer.json",
  ".vscode/extensions.json",
  ".vscode/settings.json",
]

[tool.hatch.version]
source = "vcs"

# ----------------------------
# Ruff configuration
# ----------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "E501", # let ruff format handle line length
]

# ----------------------------
# Pyright configuration
# ----------------------------
[tool.pyright]
include = ["src"]
exclude = ["tests", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
ignore = ["tests"]
extraPaths = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"

# ----------------------------
# Pylint configuration (aligned with Home Assistant Core baseline)
# ----------------------------
[tool.pylint.MAIN]
py-version = "3.14"
jobs = 2
load-plugins = [
  "pylint.extensions.code_style",
  "pylint.extensions.typing",
]
persistent = false
fail-on = ["I"]

[tool.pylint.BASIC]
class-const-naming-style = "any"

